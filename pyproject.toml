[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flower_hdfs"
version = "1.0.0"
dependencies = [
    "flwr[simulation]==1.25.0",
    "flwr-datasets>=0.5.0",
#    "torch==2.7.0",
    "trl==0.8.1",
    "scipy==1.13.0",
    "peft==0.6.2",
    "fschat[model_worker,webui]==0.2.35",
    "transformers==4.53.0",
    "sentencepiece==0.2.0",
    "omegaconf==2.3.0",
    "hf_transfer==0.1.8",
    "evaluate==0.4.6",
    "scikit-learn==1.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "ekontogi"

[tool.flwr.app.components]
serverapp = "flower_hdfs.server_app:app"
clientapp = "flower_hdfs.client_app:app"

[tool.flwr.app.config]
dataset.path= "/home/ekontogi/Diploma-Thesis/dataset/tokenized_dataset"
#model.name = "prajjwal1/bert-tiny"
model.name = "bert-base-uncased"
model.lora.peft-lora-r = 32
model.lora.peft-lora-alpha = 64
train.learning_rate = 1e-5
train.seq-length = 512
train.training-arguments.output-dir = ""
train.training-arguments.learning-rate = ""
train.training-arguments.per-device-train-batch-size = 16
train.training-arguments.gradient-accumulation-steps = 1
train.training-arguments.logging-steps = 10
train.training-arguments.num-train-epochs = 2
train.training-arguments.max-steps = 2
train.training-arguments.save-strategy = "no"
train.training-arguments.gradient-checkpointing = true
train.training-arguments.lr-scheduler-type = "constant"
train.training-arguments.warmup_ratio = 0.1
train.threshold_tuning = true
train.focal_gamma = 1
train.focal_alpha = true
dataset.dirichlet.alpha=10
strategy.type = "avg" # avg, adam
strategy.fraction-train = 0.5
strategy.fraction-evaluate = 0
num-server-rounds = 2
num-clients = 4 # should have the save value as `options.num-supernodes`

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 4
options.backend.client-resources.num-cpus = 4
options.backend.client-resources.num-gpus = 0
